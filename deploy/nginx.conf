# nginx for the DocuExtract frontend container.
# Serves the built SPA and reverse-proxies API/admin/static to the Django
# (gunicorn) backend over the shared Docker network. The "docuextract-backend"
# host name is resolved by Docker's embedded DNS at request time via a variable
# + resolver so nginx still starts if the backend is briefly unavailable.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream docuextract-backend:8000;

    # ZIP uploads go straight to the backend; allow bodies larger than the app
    # limits (MAX_UPLOAD_SIZE_MB / MAX_ARCHIVE_*_MB) so nginx never 413s first.
    # 520m = the .env default of MAX_UPLOAD_SIZE_MB (500) plus multipart
    # envelope slack. It still caps absurd bodies well below the old 800m.
    client_max_body_size 520m;

    # Per-read timeout on the request body (NOT total upload time). Bounds a
    # stalled or half-dead client that would otherwise keep a backend request
    # handler occupied in recv until gunicorn's master times it out.
    client_body_timeout 60s;
    client_body_buffer_size 1m;

    # Oversized uploads get a JSON body, not nginx's HTML error page.
    error_page 413 = @json_too_large;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # Security headers (Cloudflare already provides HSTS / HTTPS enforcement).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Django backend routes: API, admin, and WhiteNoise-served static files.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The app is only ever reached over HTTPS via the Cloudflare Tunnel, so
        # advertise https to Django (drives SECURE_PROXY_SSL_HEADER + secure cookies).
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        # Read/send must stay ABOVE gunicorn --timeout (180s) so a slow-but-alive
        # backend is not cut off by nginx first: a 504 here would mask the real
        # failure and make the incident look like an nginx problem.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Buffer the request body here and hand the backend a complete body.
        # With this off, nginx replays the upload at the CLIENT's speed, so a
        # slow tunnel upload keeps a backend thread blocked in recv for as long
        # as the transfer lasts - that is what turned one large POST into
        # WORKER TIMEOUT + SIGABRT. Buffering makes the backend's read a
        # docker-network transfer (seconds) instead of a client-speed one.
        proxy_request_buffering on;

        # /api/jobs/ returns ~634 KB and used to spill to proxy_temp
        # ("an upstream response is buffered to a temporary file"). These sizes
        # hold a ~1 MB response in memory. The payload itself still needs
        # pagination; this only removes the spill and its warning.
        proxy_buffer_size 32k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
        proxy_max_temp_file_size 8m;
    }

    # Named target for `error_page 413` above.
    location @json_too_large {
        default_type application/json;
        return 413 '{"detail": "The uploaded archive exceeds the server limit."}';
    }

    # SPA: serve hashed assets directly, fall back to index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived immutable assets.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PDF.js worker (pdf.worker.min.mjs) is an ES module. Browsers enforce
    # strict MIME checking for module scripts and refuse to load it when the
    # server replies with `application/octet-stream` -- and some nginx
    # distributions (notably the nginx:1.27-alpine base image used here)
    # omit `.mjs` from the default mime.types. `types {}` clears the
    # inherited extension-to-type map for this location only, so
    # `default_type text/javascript` applies to `.mjs` requests without
    # affecting any other asset type served from the same root.
    # Regex locations take precedence over the plain prefix `location /`,
    # so the SPA try_files cannot mask a real worker file. The api/admin/
    # static proxy above is a regex listed first in the config, so any
    # future `/static/*.mjs` request still reaches Django (nginx evaluates
    # regex locations in config order and first match wins).
    location ~ \.mjs$ {
        types { } default_type text/javascript;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

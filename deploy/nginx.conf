# nginx for the DocuExtract frontend container.
# Serves the built SPA and reverse-proxies API/admin/static to the Django
# (gunicorn) backend over the shared Docker network. The "backend" host name is
# resolved by Docker's embedded DNS at request time via a variable + resolver so
# nginx still starts if the backend is briefly unavailable.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;

    # ZIP uploads go straight to the backend; allow bodies larger than the app
    # limits (MAX_UPLOAD_SIZE_MB / MAX_ARCHIVE_*_MB) so nginx never 413s first.
    client_max_body_size 512m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers (Cloudflare already provides HSTS / HTTPS enforcement).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Django backend routes: API, admin, and WhiteNoise-served static files.
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The app is only ever reached over HTTPS via the Cloudflare Tunnel, so
        # advertise https to Django (drives SECURE_PROXY_SSL_HEADER + secure cookies).
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_request_buffering off;
    }

    # SPA: serve hashed assets directly, fall back to index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived immutable assets.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}

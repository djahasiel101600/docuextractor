# DocuExtract production stack for Ubuntu + Docker.
#
# All containers join the shared external "jdp-network" (created once by
# scripts/deploy/setup-ubuntu.sh) so they can reach other services already on it.
# Your Cloudflare Tunnel already runs on the host and is attached to that same
# network, so it reaches the app at http://docuextract-frontend:80 internally.
# This project therefore exposes NO host ports: the backend is reached only by
# the frontend nginx (which proxies /api, /admin and /static), and the frontend
# only by the tunnel, both over jdp-network.
#
# Service names are prefixed with 'docuextract-' on purpose: jdp-network is
# SHARED with many other projects, and Compose publishes each service name as a
# network-scoped DNS alias. Generic names like 'frontend'/'backend'/'db' would
# collide with other stacks (e.g. freeshow already owns the 'frontend' alias),
# so every name here is unique to this project.
#
# Secrets and tuning live in .env (see .env.example). Compose interpolates ${...}
# from .env and the `env_file` entries pass them into the containers.

name: docuextract

services:
  docuextract-db:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - jdp-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - docuextract-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  docuextract-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: docuextract-backend
    restart: unless-stopped
    networks:
      - jdp-network
    env_file:
      - .env
    # DATABASE_URL must point at the "docuextract-db" service, e.g.
    #   postgres://USER:PASSWORD@docuextract-db:5432/DBNAME  (URL-encode specials)
    # DB_SSL_REQUIRE=false because Postgres is reached over the private network.
    volumes:
      - docuextract-storage:/app/storage
    # Apply migrations (preserving existing rows) then hand off to Gunicorn.
    # Written as a LIST so the whole `sh -c` payload stays on one line. A folded
    # block scalar (command: >) would turn these indented continuation lines into
    # literal newlines, dropping the gunicorn flags after `exec` and leaving it
    # bound to 127.0.0.1 (nginx would then 502). $$ escapes compose interpolation
    # so the container shell reads GUNICORN_* from env_file at runtime.
    #
    # gthread + a real timeout backstop: a sync worker cannot answer requests
    # while it is reading an upload body, so a large ZIP upload tripped WORKER
    # TIMEOUT and got SIGABRT'd mid-parse. Keep this list identical to the
    # Dockerfile CMD - this command is what actually runs.
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --worker-class gthread --workers $${GUNICORN_WORKERS:-3} --threads $${GUNICORN_THREADS:-4} --timeout $${GUNICORN_TIMEOUT:-180} --graceful-timeout $${GUNICORN_GRACEFUL_TIMEOUT:-30} --keep-alive $${GUNICORN_KEEPALIVE:-5} --max-requests $${GUNICORN_MAX_REQUESTS:-800} --max-requests-jitter $${GUNICORN_MAX_REQUESTS_JITTER:-100} --access-logfile - --error-logfile - --log-level info
    # Spool incoming uploads onto the mounted storage volume. Without this a
    # 500 MB ZIP temp file lands in the container's writable layer. Set here
    # rather than in .env so local development keeps Django's default temp dir.
    environment:
      FILE_UPLOAD_TEMP_DIR: /app/storage/tmp
    healthcheck:
      # /api/ is the app's health endpoint: 200 when the DB is reachable, 503 otherwise.
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/', timeout=5)" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      docuextract-db:
        condition: service_healthy

  docuextract-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    image: docuextract-frontend
    restart: unless-stopped
    networks:
      - jdp-network
    # No `ports:` mapping. Your already-running Cloudflare Tunnel on jdp-network
    # reaches this service internally at http://docuextract-frontend:80, so
    # nothing is bound to a host interface.
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      docuextract-backend:
        condition: service_healthy

networks:
  # Pre-existing shared network that already connects Postgres / Tunnel infra.
  jdp-network:
    external: true

volumes:
  docuextract-postgres:
  docuextract-storage:
